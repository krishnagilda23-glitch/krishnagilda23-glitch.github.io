<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typography study — Krishna Gilda</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Manrope:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>
@font-face{font-family:Sour;src:url('/v2/fonts/sour-gummy-latin-wght-normal.woff2') format('woff2');font-weight:100 900}
*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#262626;font-family:system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:40px 28px}header{max-width:720px;margin-bottom:40px}header h1{font-size:30px;line-height:1.2;margin:16px 0}header p{font-size:16px;line-height:1.6}a{color:#9e410e;text-underline-offset:4px}#status{color:#666;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:48px 40px}.sample{border-top:1px solid #ccc;padding-top:20px;min-width:0}.label{font:500 14px system-ui,sans-serif;display:flex;justify-content:space-between;gap:16px;margin-bottom:24px}.label span{font-weight:400;color:#666}.hand{font-family:Sour,sans-serif;font-size:30px;color:#df611d;margin:0 0 12px}.sample h2{font-family:var(--face);font-size:clamp(36px,4vw,52px);line-height:1.1;letter-spacing:-.025em;font-weight:500;margin:0 0 20px}.copy{font-family:var(--face);font-size:18px;line-height:28px;font-weight:400;max-width:40ch;margin:0 0 24px}.copy em{font-style:normal;color:#b94d13}.controls{display:flex;align-items:center;gap:24px;flex-wrap:wrap;font:500 14px var(--face)}.pill{border:1px solid #808080;border-radius:999px;padding:8px 16px;color:#262626}.play{font-family:Sour,sans-serif;font-size:19px}.note{font:14px/1.6 system-ui,sans-serif;color:#666;margin-top:20px}@media(max-width:740px){.grid{grid-template-columns:1fr}main{padding:24px 20px}.sample h2{font-size:42px}}@media(prefers-reduced-motion:no-preference){a{transition:color 150ms}a:hover{color:#d85a15}}
</style></head><body><main><header><a href="/">← Back to the local website</a><h1>Same words. Four typographic directions.</h1><p>Compare the headline at weight 500 and body at weight 400. The handwritten accent stays. These are isolated studies; the portfolio font has not changed.</p><p id="status">Loading comparison fonts…</p></header><div class="grid" id="samples"></div></main><script>
const fonts=[['Manrope','My recommendation','Precise shapes with warmth. A good bridge between industrial design and a personal portfolio.'],['Plus Jakarta Sans','Warmer alternative','A softer, more rounded voice. Worth choosing if the personal illustration should lead the identity.'],['Geist','Quieter alternative','A restrained, technical voice. Strong readability, though less distinctive as a personal display face.'],['Segoe UI','Current baseline','Uses Segoe UI when installed; otherwise this device’s system font. The current Mac uses a fallback.']];
for(const [name,label,note] of fonts){const s=document.createElement('section');s.className='sample';s.style.setProperty('--face',`"${name}",system-ui,sans-serif`);s.innerHTML=`<div class="label">${name}<span>${label}</span></div><p class="hand">Hello!</p><h2>I am Krishna</h2><p class="copy">I’m an <em>industrial designer</em>, shaping physical products from user needs through production.</p><div class="controls"><span>Work</span><span class="play">Playground</span><span>About</span><span class="pill">Resume</span></div><p class="note">${note}</p>`;document.querySelector('#samples').append(s)}
Promise.all(['Manrope','Plus Jakarta Sans','Geist'].map(name=>document.fonts.load(`400 18px "${name}"`))).then(results=>{document.querySelector('#status').textContent=results.every(f=>f.length>0)?'Comparison fonts loaded. Sizes and weights are held constant.':'Some fonts could not load; this study requires access to Google Fonts.'}).catch(()=>{document.querySelector('#status').textContent='Some fonts could not load; this study requires access to Google Fonts.'});
</script></body></html>
